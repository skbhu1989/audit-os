server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing (React Router) — any path that isn't a real file
    # falls back to index.html so deep links like /dashboard work on a
    # hard refresh instead of 404ing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxies to the backend container (see docker-compose.yml's service
    # name "backend") — mirrors exactly what Vite's dev proxy does, so the
    # frontend code's relative /api/* calls work unchanged in production.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://backend:8000/health;
    }
}
