services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: audit_os
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?Set POSTGRES_SUPERUSER_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: postgres:16
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./db:/db:ro
    environment:
      DATABASE_DSN: postgresql://postgres:${POSTGRES_SUPERUSER_PASSWORD:?Set POSTGRES_SUPERUSER_PASSWORD in .env}@postgres:5432/audit_os
      APP_RUNTIME_PASSWORD: ${APP_RUNTIME_PASSWORD:?Set APP_RUNTIME_PASSWORD in .env}
    entrypoint: ["bash", "/db/migrate.sh"]
    # This container runs once and exits — backend waits for it to exit
    # 0 (service_completed_successfully) before starting, so the app never
    # tries to connect to a database that hasn't been migrated yet.

  backend:
    build: ./apps/api
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      ENVIRONMENT: production
      DATABASE_DSN: postgresql://app_runtime:${APP_RUNTIME_PASSWORD:?Set APP_RUNTIME_PASSWORD in .env}@postgres:5432/audit_os
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
