name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci_postgres_password
          POSTGRES_DB: audit_os_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: apps/api
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Apply migrations
        env:
          DATABASE_DSN: postgresql://postgres:ci_postgres_password@localhost:5432/audit_os_ci
          APP_RUNTIME_PASSWORD: ci_app_runtime_password
        run: bash db/migrate.sh

      - name: Run test suite
        working-directory: apps/api
        env:
          DATABASE_DSN: postgresql://app_runtime:ci_app_runtime_password@localhost:5432/audit_os_ci
          JWT_SECRET: ci-test-secret
          ENVIRONMENT: test
        run: pytest tests/ -v

      - name: Verify requirements.txt is genuinely complete
        # Regression test for a real bug found this project's own deploy-
        # readiness review: requirements.txt was missing email-validator,
        # only caught by importing the app in a truly clean environment.
        # Runs the same check in CI so it can never silently regress.
        run: |
          python3 -m venv /tmp/clean_venv
          /tmp/clean_venv/bin/pip install -r apps/api/requirements.txt
          cd apps/api && JWT_SECRET=x DATABASE_DSN=postgresql://x:x@localhost/x \
            /tmp/clean_venv/bin/python3 -c "import app.main"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Frontend production build
        working-directory: frontend
        run: |
          npm ci
          npm run build
